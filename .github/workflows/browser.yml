name: Reading browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue/package-lock.json
      - run: npm ci
        working-directory: vue
      - run: |
          mkdir -p output
          npm --prefix vue run dev -- --host 127.0.0.1 > output/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/login && break; sleep 1; done
          npx --yes --package @playwright/cli playwright-cli -s=reading open http://127.0.0.1:5173/login
          npx --yes --package @playwright/cli playwright-cli -s=reading run-code --filename scripts/reading-browser-regression.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-browser-results
          path: output/
